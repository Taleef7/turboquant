[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turboquant"
version = "0.1.0"
description = "Reproducible KV-cache compression experiments"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: requires a CUDA-capable GPU and is excluded from the CPU CI lane",
]

[tool.ruff]
target-version = "py311"
line-length = 88

